<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Online Voting System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="navbar">
      <div class="navbar-brand">
        <h1>🗳️ Online Voting System</h1>
      </div>
      <div class="navbar-menu">
        <a href="/" class="nav-link">Home</a>
        <a href="/register.html" class="nav-link">Register</a>
        <a href="/login.html" class="nav-link active">Login</a>
      </div>
    </div>

    <div class="form-container">
      <div class="form-box">
        <h2>Voter Login</h2>
        <p class="form-subtitle">Sign in to cast your vote</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="voterID">Voter ID *</label>
            <input 
              type="text" 
              id="voterID" 
              name="voterID" 
              placeholder="Enter your Voter ID" 
              required
            >
            <small class="error-message" id="voterIDError"></small>
          </div>

          <div class="form-group">
            <label for="password">Password *</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Enter your password" 
              required
            >
            <small class="error-message" id="passwordError"></small>
          </div>

          <div class="form-group">
            <button type="submit" class="btn btn-primary btn-full">
              <span id="submitButtonText">Login</span>
              <span id="submitButtonLoader" style="display: none;">Processing...</span>
            </button>
          </div>

          <div class="message" id="successMessage" style="display: none;"></div>
          <div class="message error" id="errorMessage" style="display: none;"></div>
        </form>

        <p class="form-footer">
          Don't have an account? <a href="/register.html">Register here</a>
        </p>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2026 Online Voting System. All rights reserved.</p>
    </div>
  </div>

    <script src="/js/main.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
